name: Upstream checks (not required)

# Checks of the whole repository, including Actual packages that Sela does
# not use (sync-server, api, cli, ci-actions, eslint-plugin-actual) and code
# that was left over when Sela removed upstream features. Known failures here
# stay visible as failures; they are not part of the required "Sela checks"
# workflow (sela.yml), which covers the app that Sela ships.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Lint (whole repository)
        run: yarn lint
  knip:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Build plugins service
        run: yarn build:plugins-service
      - name: Check for unused files, dependencies and exports
        run: yarn knip
  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Typecheck (all packages)
        run: yarn typecheck
  test:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      # The app's own packages are tested in sela.yml; these are the others.
      - name: Unit tests - api
        run: yarn workspace @actual-app/api run test
      - name: Unit tests - sync-server
        if: ${{ !cancelled() }}
        run: yarn workspace @actual-app/sync-server run test
      - name: Unit tests - cli
        if: ${{ !cancelled() }}
        run: yarn workspace @actual-app/cli run test
      - name: Unit tests - ci-actions
        if: ${{ !cancelled() }}
        run: yarn workspace @actual-app/ci-actions run test
      - name: Unit tests - eslint-plugin-actual
        if: ${{ !cancelled() }}
        run: yarn workspace eslint-plugin-actual run test
      - name: Test results summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/junit-summary.mjs upstream
